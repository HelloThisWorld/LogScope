name: CI

# All routine CI (format, lint, full tests, desktop shell smoke) runs on
# the personal macOS self-hosted runner (Apple Silicon). The Linux
# shared-core leg also runs there, inside a linux/arm64 container, so it
# needs no hosted minutes. The only GitHub-hosted job is the Windows
# packaging job, which cannot run on the Mac and stays dispatch-gated
# while the Actions billing limit blocks hosted minutes.
#
# SECURITY RED LINE: a self-hosted runner must never serve a public
# repository. If this repo is ever made public, move every job back to
# GitHub-hosted runners BEFORE changing visibility — public-repo pull
# requests would otherwise execute untrusted code on personal hardware.
#
# Trigger design:
# - pull_request: the validation path.
# - workflow_dispatch: on-demand run; also the only way to run the
#   Windows packaging job.
# - No push-to-main build: an ordinary merge was already validated by
#   its PR. No cache cron either — the self-hosted runner keeps its
#   Cargo target directory warm on local disk between runs, so there is
#   no hosted-cache scope to seed or refresh.
#
# Runner prerequisites (installed on the Mac, not by this workflow):
# rustup with the stable toolchain (rustfmt + clippy), Xcode Command
# Line Tools (C/C++ for the bundled DuckDB/SQLite builds), Node.js 22+.

on:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Nobody debugs CI test binaries; dropping dev-profile debuginfo cuts
  # build time and disk churn (release profile is untouched).
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  mac-ci:
    # One serial job on the single runner: separate jobs would only add
    # checkouts and queueing, and one job keeps one warm target dir.
    name: Lint + tests + shell smoke (macOS self-hosted)
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Put user toolchains on PATH
        # The runner service starts with a minimal PATH; rustup installs
        # to ~/.cargo/bin and Homebrew (Apple Silicon) to /opt/homebrew.
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
      - name: Toolchain versions (fails fast if the Mac is missing one)
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
          node --version
          npm --version
      - run: cargo fmt --check
      - run: cargo clippy --workspace --exclude logscope-desktop --tests -- -D warnings
      - run: cargo test --workspace --exclude logscope-desktop
      - name: Frontend build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Tauri desktop shell build smoke
        run: cargo build -p logscope-desktop

  linux-core:
    # Shared-core semantics only: path canonicalization, encodings,
    # timezones, line endings and file identity on a case-sensitive
    # filesystem. The Tauri desktop shell is excluded deliberately —
    # Linux is not a release platform and the desktop-shell build check
    # belongs to the macOS job.
    #
    # Runs in a Linux container ON the self-hosted macOS runner rather than
    # on a GitHub-hosted Linux runner, because hosted minutes are
    # unavailable under the Actions billing limit. Apple Silicon executes
    # linux/arm64 containers natively, so this is real Linux — not
    # emulation — and it exercises exactly what this leg is for:
    # case-sensitive filesystem behaviour, POSIX path canonicalization,
    # encodings, line endings and timezone handling. It is NOT an x86_64
    # check; the architecture difference is deliberate and recorded,
    # because emulating amd64 would make the bundled DuckDB build
    # impractically slow for no additional signal on these semantics.
    #
    # Dispatch-gated so it does not serialize behind mac-ci on every PR —
    # there is one self-hosted runner. Move to `pull_request` if a second
    # runner becomes available.
    name: Shared core (Linux container, arm64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Put user toolchains and Docker on PATH
        # The runner service starts with a minimal PATH, exactly as in the
        # macOS job above. Docker Desktop only symlinks its CLI into
        # /usr/local/bin if it was granted privileged access on first
        # launch; otherwise the binaries stay inside the app bundle and are
        # reachable only through a shell profile the runner never reads.
        # The app-bundle path is therefore included explicitly, so the leg
        # works whether or not those symlinks exist.
        run: |
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.docker/bin" >> "$GITHUB_PATH"
          echo "/Applications/Docker.app/Contents/Resources/bin" >> "$GITHUB_PATH"
      - name: Verify Docker is available
        # Fail fast with an actionable message rather than a confusing
        # "command not found" halfway through the job.
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker was not found. Searched PATH: $PATH" >&2
            echo "If Docker Desktop is installed, launch it once so it creates its CLI links," >&2
            echo "or add its bin directory to the PATH step above. 'colima' also works." >&2
            exit 1
          fi
          echo "docker CLI: $(command -v docker)"
          docker version --format 'server {{.Server.Version}}' || {
            echo "::error::The docker CLI is present but its daemon is not reachable." >&2
            echo "Start Docker Desktop (or run 'colima start') on the runner host." >&2
            exit 1
          }
      - name: Shared-core clippy + tests in a Linux container
        # CARGO_TARGET_DIR is redirected inside the container so Linux
        # build output never lands in the macOS runner's warm target dir.
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e CARGO_TERM_COLOR=always \
            -e CARGO_TARGET_DIR=/tmp/target-linux \
            rust:1-bookworm \
            bash -c '
              set -euo pipefail
              rustc --version && cargo --version
              cargo clippy --workspace --exclude logscope-desktop --tests -- -D warnings
              cargo test --workspace --exclude logscope-desktop
            '

  package-windows:
    # On demand only (workflow_dispatch): PR iteration does not need a
    # cloud-built archive and release packaging is driven locally via
    # scripts/package-portable.ps1. Stays on a hosted Windows runner —
    # Windows artifacts cannot be produced on the macOS runner — so it
    # requires available GitHub-hosted minutes when dispatched.
    name: Portable ZIP (Windows, unsigned)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: win-release
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend install
        working-directory: apps/desktop
        run: npm ci
      - name: Assemble portable archive (no signing identity)
        run: pwsh scripts/package-portable.ps1 -Version 0.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: LogScope-windows-x64-portable
          path: |
            dist-portable/*.zip
            dist-portable/*.sha256
