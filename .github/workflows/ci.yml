name: CI

# All CI runs on GitHub-hosted runners. This repository is PUBLIC, and
# hosted standard runners are free for public repositories.
#
# SECURITY RED LINE (now in its public-repo form): a self-hosted runner
# must NEVER be registered to this repository again while it is public.
# Fork pull requests execute untrusted code; on a hosted runner that is
# an isolated throwaway VM, on a self-hosted runner it is someone's
# personal machine. The previous self-hosted design and its rationale
# are preserved in the git history of this file.
#
# Speed strategy — the bundled DuckDB C/C++ build dominates cold compile
# time, so the whole design exists to compile it rarely:
# - Per-OS Cargo caches (Swatinem/rust-cache). A warm cache skips the
#   expensive dependency builds entirely.
# - Caches are SAVED only by push builds of main; pull requests restore
#   main's cache and never write their own. A cancelled PR run once
#   saved a partial cache that exact-key-shadowed main's good one and
#   produced 40-minute "warm" builds — PR-scope saves are how that
#   happens, so PRs do not save.
# - Jobs run in parallel, so wall time is the slowest job, not the sum.
# - Every job carries timeout-minutes: a wedged job dies in bounded
#   time, never at GitHub's 6-hour default.
#
# Platform matrix (shared-core gate 159): x86_64 Linux (case-sensitive
# filesystem, POSIX path semantics), x86_64 Windows (the release
# platform), arm64 macOS. Linux on hosted runners is real x86_64 — an
# upgrade over the retired arm64-container leg, which had to record an
# architecture apology.
#
# Triggers:
# - pull_request: the validation path.
# - push to main: refreshes the shared caches and keeps the badge
#   telling the truth about main.
# - workflow_dispatch: on-demand runs; the only trigger for the Windows
#   packaging job.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Fork PRs run with a read-only token; nothing in CI needs more.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Nobody debugs CI test binaries; dropping dev-profile debuginfo cuts
  # build time and disk churn (release profile is untouched).
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  linux:
    name: Lint + shared-core tests (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --exclude logscope-desktop --tests -- -D warnings
      - run: cargo test --workspace --exclude logscope-desktop

  windows:
    name: Shared-core tests + desktop shell smoke (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --workspace --exclude logscope-desktop
      - name: Frontend build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Desktop shell build smoke
        # Debug build, not check: linking is where WebView2 and the
        # Windows toolchain break, and this is the platform we ship.
        run: cargo build -p logscope-desktop

  macos:
    name: Shared-core tests (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --exclude logscope-desktop

  package-windows:
    # On demand only (workflow_dispatch): PR iteration does not need a
    # cloud-built archive, and release packaging is driven locally via
    # scripts/package-portable.ps1 (ADR-0018). The windows job above
    # already proves the desktop shell builds on every PR.
    name: Portable ZIP (Windows, unsigned)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: win-release
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend install
        working-directory: apps/desktop
        run: npm ci
      - name: Assemble portable archive (no signing identity)
        run: pwsh scripts/package-portable.ps1 -Version 0.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: LogScope-windows-x64-portable
          path: |
            dist-portable/*.zip
            dist-portable/*.sha256
