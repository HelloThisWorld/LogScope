name: CI

# All jobs run on GitHub-hosted runners with aggressively shared caches.
#
# Trigger design:
# - pull_request: the validation path (lint + tests; no packaging).
# - workflow_dispatch: full on-demand run including the portable ZIP;
#   running it on main also (re)seeds main's cache scope.
# - push to main, filtered to Cargo.lock / this file: ordinary merges do
#   NOT rebuild (the PR already validated the same tree) — only merges
#   that change the dependency graph or the CI definition run, which is
#   exactly when main's caches need refreshing.
# - weekly schedule: GitHub evicts caches unused for ~7 days; a weekly
#   warm run keeps main's cache scope alive (and picks up new stable
#   toolchains). With warm caches it is short and cheap.
#
# Cold-start avoidance: rust-cache keys include the branch-independent
# `shared-key` below plus toolchain/lockfile hashes, and PR branches may
# restore caches saved on main. Keeping main's scope warm therefore
# gives every new PR branch a full (exact-key) cache hit instead of a
# 40-60 minute cold build of the bundled native deps (DuckDB C++,
# Arrow, SQLite).
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  schedule:
    - cron: "0 19 * * 0" # Mon 03:00 UTC+8 — weekly cache refresh

# A newer push to the same branch/PR supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # MSVC PDB generation dominates link time and nobody debugs CI test
  # binaries; drop dev-profile debuginfo (release profile is untouched).
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  lint:
    name: Format and lint (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: win-lint
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --workspace --exclude logscope-desktop --tests -- -D warnings

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: win-test
          cache-on-failure: true
      - run: cargo test --workspace --exclude logscope-desktop

  core-linux:
    name: Shared-core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-core
          cache-on-failure: true
      # Platform-neutral core: model, normalization, jobs, workspace,
      # ingest, storage. (DuckDB-dependent query tests run on the desktop
      # OS jobs to keep this job fast.)
      - run: >
          cargo test -p logscope-model -p logscope-normalize -p logscope-jobs
          -p logscope-workspace -p logscope-ingest -p logscope-store

  core-macos:
    name: Shared-core tests + shell build smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-core
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: >
          cargo test -p logscope-model -p logscope-normalize -p logscope-jobs
          -p logscope-workspace -p logscope-ingest -p logscope-store
      - name: Frontend build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Tauri desktop shell build smoke
        run: cargo build -p logscope-desktop

  package-windows:
    # On demand only (workflow_dispatch): PR iteration does not need a
    # cloud-built archive and release packaging is driven locally via
    # scripts/package-portable.ps1.
    name: Portable ZIP (Windows, unsigned)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: win-release
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend install
        working-directory: apps/desktop
        run: npm ci
      - name: Assemble portable archive (no signing identity)
        run: pwsh scripts/package-portable.ps1 -Version 0.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: LogScope-windows-x64-portable
          path: |
            dist-portable/*.zip
            dist-portable/*.sha256
