[package]
name = "logscope-app"
description = "Application services behind the typed command boundary (shared by desktop and future CLI)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
logscope-case.workspace = true
logscope-model.workspace = true
logscope-normalize.workspace = true
logscope-workspace.workspace = true
logscope-jobs.workspace = true
logscope-ingest.workspace = true
logscope-store.workspace = true
logscope-query.workspace = true
logscope-query-lang.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
parking_lot.workspace = true
flate2.workspace = true
crossbeam-channel.workspace = true
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
blake3.workspace = true
sha2.workspace = true
# Linear-time regex engine (same as logscope-query-lang) for bounded
# safe-regex redaction rules.
regex = "1"
# Case-bundle container (same crate/features as logscope-ingest).
zip = { version = "8", default-features = false, features = ["deflate"] }
# Same pinned build as logscope-query (typed params for derived-data
# writes through the shared engine connection).
duckdb = { version = "1.10505.0", features = ["bundled", "json", "parquet"] }

[dev-dependencies]
tempfile.workspace = true
rusqlite = { version = "0.40.1", features = ["bundled"] }
