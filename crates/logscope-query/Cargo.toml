[package]
name = "logscope-query"
description = "Query service: DuckDB over immutable Parquet segments, bounded pages, cancellation, FTS"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
duckdb = { version = "1.10505.0", features = ["bundled", "json", "parquet"] }
logscope-model.workspace = true
logscope-store.workspace = true
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
